name: 📅 每日轮虫保种提醒

on:
  workflow_dispatch:   # 只允许手动运行
  # schedule:
  #   - cron: '14 7 * * *'   # 需要恢复每天定时时，取消注释

jobs:
  run-reminder:
    runs-on: ubuntu-latest

    steps:
    - name: 🛠️ 步骤1：拉取当前仓库代码
      uses: actions/checkout@v3

    - name: 🐍 步骤2：初始化 Python 环境
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: 📦 步骤3：安装必要的依赖库 (requests)
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 🚀 步骤4：执行配置计算并推送 PushDeer
      run: python rotifer_reminder.py
