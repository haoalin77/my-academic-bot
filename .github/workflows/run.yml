name: Daily Academic Report Bot

on:
  push:                    # 保留手动触发：当你改代码时会立刻跑一次，方便测试
    branches: [ "main" ]
  schedule:
    - cron: '5 23 * * *'    # ⏰ 闹钟已调校：UTC 01:05 = 北京时间 09:05 准时群发

jobs:
  run-bot:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 签出仓库代码
      uses: actions/checkout@v4

    - name: 2. 初始化 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: 3. 一键安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 "urllib3<2"

    - name: 4. 火力全开！运行自动化脚本
      run: |
        python index.py
