name: Daily Academic Report Bot

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:       # 🚀 【核心加入】手动暴击开关！加了它，Actions 页面会多出一个“运行”按钮！
  schedule:
    - cron: '31 0 * * *'    # ⏰ 每天北京时间 08:31 自动排队

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
    - name: 1. 签出仓库代码
      uses: actions/checkout@v4
    - name: 2. 初始化 Python 环境
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'
    - name: 3. 一键安装依赖包
      run: |
        python -m pip install --upgrade pip
        pip install requests beautifulsoup4 "urllib3<2"
    - name: 4. 火力全开！运行自动化脚本
      run: |
        python index.py
