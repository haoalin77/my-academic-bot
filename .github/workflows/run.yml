name: 10 Minutes Regulatory Test

on:
  push:                    #  保留手动触发，确保我们能测试代码本身通不通
    branches: [ "main" ]
  schedule:
    - cron: '*/10 * * * *'   # ✅ 合规数字：每 10 分钟触发一次，绝对不踩 GitHub 防滥用红线

jobs:
  fast-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 签出代码
      uses: actions/checkout@v4

    - name: 2. 初始化 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: 3. 极速运行测试
      run: python index.py
