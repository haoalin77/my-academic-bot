name: 10 Minutes Regulatory Test

on:
  push:                    # 保留手动触发
    branches: [ "main" ]
  schedule:
    - cron: '*/10 * * * *'   # ✅ 合规数字：每 10 分钟触发一次

jobs:
  fast-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 签出代码
      uses: actions/checkout@v4

    - name: 2. 初始化 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: 3. 一键安装依赖包（解决报错的关键）
      run: |
        python -m pip install --upgrade pip
        pip install requests

    - name: 4. 极速运行测试
      run: python index.py
