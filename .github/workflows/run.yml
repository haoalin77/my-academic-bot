name: 5 Minutes Rapid Test

on:
  schedule:
    - cron: '*/2 * * * *'    # ⏰ 2分钟极限轰炸测试

jobs:
  fast-test:
    runs-on: ubuntu-latest

    steps:
    - name: 1. 签出代码
      uses: actions/checkout@v4

    - name: 2. 初始化 Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: 3. 极速运行测试
      run: python index.py
